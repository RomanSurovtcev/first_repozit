<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="broker.css">
</head>
<body>
    <div class="page">
      <main class="page__content">
        <header class="header">
          <div class="logo">
            <img src="/svg/Logo.svg" alt="Логотип" class="header__logo">
          </div>
          <nav class="nav">
            <a href="#" class="nav__link">Пассивный заработок</a>
            <a href="#" class="nav__link">Публичный трейдинг</a>
            <a href="#" class="nav__link">Доходы и безопасность</a>
            <a href="#" class="nav__link">Обратная связь</a>
          </nav>
          <div class="header__actions">
            <button class="btn btn_primary">Вход</button>
          </div>
        </header>
        <section class="first-display">
          <div class="first-display__content">
            <h1 class="title title_h1">Инвестируй
              с лучшими крипто-трейдерами</h1>
            <p class="first-display__descr">Сервис автоматического копирования сделок
               на криптовалютных биржах.</p>
            <div class="first-display__actions">
              <button class="btn btn_primary">Создать аккаунт</button>
            </div>
          </div>
          <p class="first-display__pict">Пассивный зароботок</p>
          <p class="first-display__pict">Публичный трейдинг</p>
          <img src="/picture/Man.jpg" alt="Мужчина" class="first-display__bg">
        </section>
        <section class="pass-income"></section>
        <section class="publ-trade"></section>
        <section class="tg-trade"></section>
        <footer class="footer"></footer>
      </main>
    </div>
</body>
</html>
